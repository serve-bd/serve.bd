server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;

  # Behind a proxy with HTTPS: keep redirects relative, so /docs -> /docs/ stays on https.
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
  gzip_min_length 1024;

  # The installer and its files live in the site (bun run installer:sync), so GitHub is never on
  # the way. Short caching: a new installer reaches everyone within a minute of a deploy.
  location = /install.sh {
    default_type text/plain;
    add_header Cache-Control "public, max-age=60";
  }
  location /install/ {
    default_type text/plain;
    add_header Cache-Control "public, max-age=60";
  }

  # Built files have a hash in their name, so they never change.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  error_page 404 /404.html;
}
